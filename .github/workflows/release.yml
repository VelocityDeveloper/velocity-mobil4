name: Release theme version

on:
  push:
    branches:
      - main
    paths:
      - style.css

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read theme version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n 1 | tr -d '\r')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create ZIP package
        shell: bash
        run: |
          mkdir -p dist/velocity-mobil4
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/velocity-mobil4/
          cd dist
          zip -qr "velocity-mobil4-${{ steps.version.outputs.version }}.zip" velocity-mobil4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "dist/velocity-mobil4-$VERSION.zip" --generate-notes --title "$TAG"
